name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # para publicar o Release nas tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: python -m pip install -r requirements.txt pyinstaller
      - name: PyInstaller (instalável e portátil)
        run: |
          pyinstaller --noconfirm --clean packaging\windows\oculodiag.spec
          pyinstaller --noconfirm packaging\windows\oculodiag-portatil.spec
      - name: Teste rápido dos executáveis
        shell: pwsh
        run: |
          foreach ($exe in @("dist\OculoDiag\OculoDiag.exe", (Get-Item dist\OculoDiag-*-portatil.exe).FullName)) {
            $p = Start-Process $exe -ArgumentList "--simular" -PassThru
            Start-Sleep 15   # o portátil descompacta antes de abrir
            if ($p.HasExited) { throw "$exe fechou ao iniciar (código $($p.ExitCode))" }
            Stop-Process $p -Force
          }
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Select-String -Path oculo_diag.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: OculoDiag-windows
          path: |
            dist/OculoDiag-*-setup.exe
            dist/OculoDiag-*-portatil.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## Como baixar

          **Mais fácil — OculoDiag-…-portatil.exe**
          Baixe e dê dois cliques. Não precisa instalar nada. Pode guardar na Área de Trabalho ou num pen drive.
          A primeira abertura demora alguns segundos.

          **Instalador — OculoDiag-…-setup.exe**
          Instala o programa e cria atalhos no Menu Iniciar (inclusive um de simulação, sem câmeras).

          Se o Windows mostrar "O Windows protegeu o computador": clique em **Mais informações** → **Executar assim mesmo**.
          "@
          gh release create $env:GITHUB_REF_NAME (Get-Item dist\OculoDiag-*-portatil.exe, dist\OculoDiag-*-setup.exe) --title "OculoDiag $env:GITHUB_REF_NAME" --notes $notes
